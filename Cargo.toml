[package]
name = "cp2102n-serial-io-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Discover CP2102N serial devices and control GPIO2/GPIO3 runtime levels"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "cp2102n-serial-io-control"
path = "src/bin/cp2102n-serial-io-control/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
serialport = "4.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpio-cdev = "0.6"
